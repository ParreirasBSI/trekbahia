name: trekbahia
description: "TrekBahia - trilhas e cachoeiras da Bahia (Avaliacao I - Programacao Movel, IFBA)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  toast: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - recursos/jsons/trilhas.json
    - recursos/jsons/usuarios.json
